<!DOCTYPE html>

<head>

        name="viewport"

    <title>Ace Values - Calculator</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            background:
                radial-gradient(
                    circle at top,
                    #071d2b 0%,
                    #00101c 45%,
                    #000000 100%
                );

            background-attachment: fixed;

            color: white;

            min-height: 100vh;

            margin: 0;

            font-family: Arial, sans-serif;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        .page {
            width: 100%;

            max-width: 750px;

            padding: 60px 20px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        h1 {
            font-size: 55px;

            margin-bottom: 15px;
        }


        h2 {
            font-size: 30px;

            text-align: center;
        }


        .search-area {
            width: 100%;

            text-align: center;
        }


        .search-row {
            display: flex;

            justify-content: center;

            gap: 10px;
        }


        input {
            width: 300px;

            background-color: #111c2b;

            color: white;

            border: 1px solid #24445c;

            padding: 14px;

            border-radius: 8px;

            font-size: 17px;

            outline: none;
        }


        input:focus {
            border-color: #39c6ff;
        }


        input::placeholder {
            color: #8c98a4;
        }


        button {
            background-color: #252b30;

            color: white;

            border: none;

            padding: 14px 22px;

            border-radius: 8px;

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s;
        }


        button:hover {
            background-color: #343c43;

            transform: translateY(-2px);
        }


        #result {
            margin-top: 30px;

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        #result:empty {
            display: none;
        }


        .result-card {
            width: 100%;

            max-width: 430px;

            padding: 25px;

            background:
                linear-gradient(
                    145deg,
                    #111c2b,
                    #07111c
                );

            border: 1px solid #24445c;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.4);
        }


        .item-image {
            width: 180px;

            height: 180px;

            object-fit: contain;

            margin-bottom: 15px;
        }


        .result-card h3 {
            font-size: 30px;

            margin:
                5px
                0
                20px;
        }


        .item-info {
            background-color:
                rgba(0, 0, 0, 0.25);

            border:
                1px solid
                #1e3547;

            padding: 15px;

            border-radius: 12px;
        }


        .info-row {
            display: flex;

            justify-content:
                space-between;

            gap: 25px;

            padding: 11px 0;

            border-bottom:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            font-size: 18px;
        }


        .info-row:last-child {
            border-bottom: none;
        }


        .label {
            color: #aeb9c4;
        }


        .value {
            color: #39c6ff;
        }


        .price {
            color: #ffd500;
        }


        .demand {
            color: #28e59a;
        }


        .fruit-type {
            color: #78bfff;
        }


        .suggestion {
            color: #aaaaaa;
        }


        .not-found {
            color: #ff6868;

            font-size: 18px;
        }


        .back-button {
            margin-top: 35px;
        }



        /* Dragon choice buttons */

        .dragon-options {
            display: flex;

            gap: 12px;

            justify-content: center;

            flex-wrap: wrap;

            margin-top: 15px;
        }


        .dragon-choice {
            min-width: 150px;
        }


        @media (max-width: 600px) {

            .dragon-options {
                flex-direction: column;

                width: 100%;
            }


            .dragon-choice {
                width: 100%;
            }
        }


        @media (max-width: 600px) {

            h1 {
                font-size: 40px;
            }


            .search-row {
                flex-direction: column;
            }


            input {
                width: 100%;
            }


            .search-row button {
                width: 100%;
            }
        }

    </style>

</head>

/* ================================
   CHECK VALUE
================================ */


function checkValue() {

    let search = document
        .getElementById("fruitInput")
        .value
        .toLowerCase()
        .trim();


    if (search === "") {

        document
            .getElementById("result")
            .innerHTML = `
                <p class="not-found">
                    Please enter an item name.
                </p>
            `;

        return;
    }


    if (aliases[search]) {
        search = aliases[search];
    }


    // If somebody only types "dragon", let them choose which one
    if (search === "dragon") {

        document
            .getElementById("result")
            .innerHTML = `

                <div class="result-card">

                    <h3>Which Dragon?</h3>

                    <div class="dragon-options">

                        <button
                            class="dragon-choice"
                            onclick="chooseDragon('east dragon')"
                        >
                            East Dragon
                        </button>

                        <button
                            class="dragon-choice"
                            onclick="chooseDragon('west dragon')"
                        >
                            West Dragon
                        </button>

                    </div>

                </div>

            `;

        return;
    }


    if (items[search]) {

        showResult(
            search,
            items[search]
        );

        return;
    }


    const names = Object.keys(items);

    let closestName = null;

    let smallestDistance = Infinity;


    for (const name of names) {

        const distance =
            levenshteinDistance(
                search,
                name
            );


        if (distance < smallestDistance) {

            smallestDistance = distance;

            closestName = name;
        }
    }


    let allowedMistakes = 2;


    if (search.length >= 10) {
        allowedMistakes = 3;
    }


    if (smallestDistance <= allowedMistakes) {

        showResult(
            closestName,
            items[closestName],
            search
        );

    } else {

        document
            .getElementById("result")
            .innerHTML = `

                <p class="not-found">
                    Item not found.
                </p>

            `;
    }
}



/* ================================
   DRAGON CHOICE
================================ */


function chooseDragon(dragonName) {

    document
        .getElementById("fruitInput")
        .value = dragonName;

    checkValue();
}



/* ================================
   SHOW RESULT
================================ */


function showResult(
    name,
    item,
    originalSearch = null
) {

    const result =
        document
            .getElementById("result");


    let suggestion = "";


    if (originalSearch) {

        suggestion = `

            <p class="suggestion">

                Did you mean

                <strong>
                    ${formatName(name)}
                </strong>?

            </p>

        `;
    }


    let imageHTML = "";


    if (item.image) {

        imageHTML = `

            <img
                src="${item.image}"
                alt="${formatName(name)}"
                class="item-image"
                onerror="this.style.display='none'"
            >

        `;
    }


    result.innerHTML = `

        ${suggestion}


        <div class="result-card">


            ${imageHTML}


            <h3>
                ${formatName(name)}
            </h3>


            <div class="item-info">


                <div class="info-row">

                    <span class="label">
                        Value
                    </span>

                    <strong class="value">
                        ${formatValue(item.value)}
                    </strong>

                </div>


                <div class="info-row">

                    <span class="label">
                        Demand
                    </span>

                    <strong class="demand">
                        ${item.demand}
                    </strong>

                </div>


                <div class="info-row">

                    <span class="label">
                        ${item.priceType} Price
                    </span>

                    <strong class="price">
                        ${formatPrice(
                            item.price,
                            item.priceType
                        )}
                    </strong>

                </div>


                <div class="info-row">

                    <span class="label">
                        Fruit Type
                    </span>

                    <strong class="fruit-type">
                        ${item.fruitType}
                    </strong>

                </div>


            </div>


        </div>

    `;
}



/* ================================
   FORMAT VALUE
================================ */


function formatValue(value) {

    if (value === "N/A") {
        return "N/A";
    }


    if (value >= 1000000000) {

        return (
            value / 1000000000
        )
        .toFixed(2)
        .replace(/\.?0+$/, "")
        + "B";
    }


    if (value >= 1000000) {

        return (
            value / 1000000
        )
        .toFixed(2)
        .replace(/\.?0+$/, "")
        + "M";
    }


    if (value >= 1000) {

        return (
            value / 1000
        )
        .toFixed(1)
        .replace(/\.0$/, "")
        + "K";
    }


    return value;
}



/* ================================
   FORMAT PRICE
================================ */


function formatPrice(
    price,
    type
) {

    if (price === "N/A") {
        return "N/A";
    }


    if (typeof price === "string") {
        return price;
    }


    if (type === "Beli") {

        return (
            "$" +
            price.toLocaleString()
        );
    }


    return price.toLocaleString();
}



/* ================================
   FORMAT NAME
================================ */


function formatName(name) {

    return name
        .split(" ")
        .map(
            word =>
                word
                    .charAt(0)
                    .toUpperCase()
                +
                word.slice(1)
        )
        .join(" ");
}



/* ================================
   TYPO MATCHING
================================ */


function levenshteinDistance(
    a,
    b
) {

    const matrix = [];


    for (
        let i = 0;
        i <= b.length;
        i++
    ) {

        matrix[i] = [i];
    }


    for (
        let j = 0;
        j <= a.length;
        j++
    ) {

        matrix[0][j] = j;
    }


    for (
        let i = 1;
        i <= b.length;
        i++
    ) {

        for (
            let j = 1;
            j <= a.length;
            j++
        ) {

            if (
                b.charAt(i - 1)
                ===
                a.charAt(j - 1)
            ) {

                matrix[i][j] =
                    matrix[i - 1][j - 1];

            } else {

                matrix[i][j] =
                    Math.min(
                        matrix[i - 1][j - 1] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j] + 1
                    );
            }
        }
    }


    return matrix[b.length][a.length];
}
